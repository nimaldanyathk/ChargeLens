# Render blueprint - one service, the Docker image serves API + UI.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: chargelens
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # demo data seeds itself on first boot; the free tier's disk is
      # ephemeral, so a restart simply re-seeds (fine for a demo)
      - key: CHARGELENS_AUTO_SEED
        value: "true"
      # optional - set in the dashboard to enable connected mode:
      #   CHARGELENS_RZP_WEBHOOK_SECRET   (dispute webhooks)
      #   RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET  (contest submission)
      #   CHARGELENS_ANTHROPIC_API_KEY    (LLM response drafting)
